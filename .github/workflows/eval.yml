name: RAG Eval
on:
  pull_request:
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    # PR de fork nao tem token de escrita para comentar
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # o runner sai com 1 se recall@5 < 0.85 ou faithfulness < 0.9; o comentario sai antes de falhar o job
      - id: eval
        run: pnpm eval
        continue-on-error: true
      - name: Comentar metricas no PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('evals/results/latest.md', 'utf8');
            const marker = '<!-- docmind-rag-eval -->';
            const body = `${marker}\n### Avaliação RAG\n\n${md}\n\ncommit ${context.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find((c) => c.body?.includes(marker));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - if: steps.eval.outcome == 'failure'
        run: echo "Métricas abaixo do mínimo (recall@5 < 0.85 ou faithfulness < 0.9)" && exit 1
